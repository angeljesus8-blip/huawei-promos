name: Diagnóstico precio

# Temporal: ver por qué algunas buy pages no sueltan el precio.
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - run: python debug_precio.py
