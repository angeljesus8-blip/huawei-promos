name: Diagnóstico regalos

# Temporal: sirve para ver cómo nombra Huawei los obsequios en la página renderizada.
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - run: python debug_regalos.py
